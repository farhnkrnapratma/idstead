version = 1

[[annotations]]
path = [
    "**/*.md",
    "**/*.json",
    "**/*.jsonc",
    "bun.lock",
    "run.conf",
    "apps/web/_headers",
    "apps/*/src/app.html",
    "packages/data/d1/migrations/**",
    "tests/__snapshots__/**",
    "tests/fixtures/**",
    ".claude/agents/**",
    ".claude/hooks/**",
    ".claude/rules/**",
    ".claude/CLAUDE.md",
    ".claude/settings.json",
    ".claude/launch.json",
    ".claude/skills/api-contract-check/**",
    ".claude/skills/change-type/**",
    ".claude/skills/committing-with-commitlint/**",
    ".claude/skills/create-migration/**",
    ".claude/skills/finish-feature/**",
    ".claude/skills/rest-api-best-practices/**",
    ".claude/skills/setup-idstead/**",
    ".claude/skills/ui-consistency-check/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Farhan Kurnia Pratama"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["packages/mdrs/**/*.md", "packages/mdrs/**/*.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Farhan Kurnia Pratama"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "brand/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Farhan Kurnia Pratama"
SPDX-License-Identifier = "LicenseRef-All-Rights-Reserved"

[[annotations]]
path = "packages/ui/src/fonts/MartianMono-*"
precedence = "override"
SPDX-FileCopyrightText = "2020 The Martian Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "packages/ui/src/fonts/PaperMono-*"
precedence = "override"
SPDX-FileCopyrightText = "2025 The Paper-Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["packages/lib/src/data/password-words.json", "packages/lib/src/data/password-words.LICENSE.md"]
precedence = "override"
SPDX-FileCopyrightText = "Electronic Frontier Foundation"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
    ".claude/skills/animate/**",
    ".claude/skills/animation-performance/**",
    ".claude/skills/animation-vocabulary/**",
    ".claude/skills/apple-design/**",
