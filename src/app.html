<!-- @format -->

<!doctype html>
<html
  lang="en"
  translate="no">
  <head>
    <script>
      window.dataLayer = window.dataLayer || []

      function gtag(...args) {
        dataLayer.push(args)
      }

      let savedConsent = null
      try {
        const stored = localStorage.getItem('fkp_cookie_consent_v2')
        if (stored) savedConsent = JSON.parse(stored)
      } catch (e) {}

      const defaultConsent = {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      }

      if (savedConsent) {
        defaultConsent.analytics_storage =
          savedConsent.analytics_storage || 'denied'
        defaultConsent.ad_storage = savedConsent.ad_storage || 'denied'
        defaultConsent.ad_user_data = savedConsent.ad_user_data || 'denied'
        defaultConsent.ad_personalization =
          savedConsent.ad_personalization || 'denied'
      } else {
        defaultConsent.wait_for_update = 500
      }

      gtag('consent', 'default', defaultConsent)
      gtag('set', 'url_passthrough', true)

      ;(function (w, d, s, l, i) {
        w[l] = w[l] || []
        w[l].push({'gtm.start': new Date().getTime(), event: 'gtm.js'})
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : ''
        j.async = true
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl
        f.parentNode.insertBefore(j, f)
      })(window, document, 'script', 'dataLayer', 'GTM-TSBRHB6V')
    </script>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#09090b" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://cdn.fkp.my.id/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://cdn.fkp.my.id/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="https://cdn.fkp.my.id/favicon-16x16.png" />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://cdn.fkp.my.id/favicon.ico" />
    <link
      rel="manifest"
      href="https://cdn.fkp.my.id/site.webmanifest" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    %sveltekit.head%
  </head>
  <body class="min-h-screen">
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-TSBRHB6V"
        height="0"
        width="0"
        style="display: none; visibility: hidden"></iframe
    ></noscript>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
