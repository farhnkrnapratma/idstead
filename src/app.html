<!doctype html>
<html
    lang="en"
    translate="no"
    class="scroll-pt-17 scroll-pb-21 overflow-x-clip scroll-smooth font-sans text-[122%]">
    <head>
        <meta charset="utf-8" />
        <script>
            document.documentElement.classList.add('dark');
        </script>
        <script>
            window.dataLayer = window.dataLayer || [];

            function gtag() {
                window.dataLayer.push(arguments);
            }

            let savedConsent = null;
            try {
                const stored = localStorage.getItem('fkp_cookie_consent_v2');
                if (stored) savedConsent = JSON.parse(stored);
            } catch (e) {}

            const defaultConsent = {
                analytics_storage: 'denied',
                ad_storage: 'denied',
                ad_user_data: 'denied',
                ad_personalization: 'denied'
            };

            if (savedConsent) {
                defaultConsent.analytics_storage = savedConsent.analytics_storage || 'denied';
                defaultConsent.ad_storage = savedConsent.ad_storage || 'denied';
                defaultConsent.ad_user_data = savedConsent.ad_user_data || 'denied';
                defaultConsent.ad_personalization = savedConsent.ad_personalization || 'denied';
            } else {
                defaultConsent.wait_for_update = 500;
            }

            gtag('consent', 'default', defaultConsent);
            gtag('set', 'url_passthrough', true);
            gtag('js', new Date());
            gtag('config', 'G-6HR3DKWZLF');
        </script>
        <script
            async
            src="https://www.googletagmanager.com/gtag/js?id=G-6HR3DKWZLF"></script>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1" />
        <link
            rel="ard"
            href="/.well-known/ard.json" />
        %sveltekit.head%
    </head>
    <body
        class="m-0 min-h-screen w-full overflow-x-clip bg-background p-0 font-sans text-text-primary">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
