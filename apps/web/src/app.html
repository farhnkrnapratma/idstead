<!doctype html>
<html
    lang="en"
    translate="no"
    class="scroll-pt-20 scroll-pb-21 overflow-x-clip scroll-smooth font-sans">
    <head>
        <meta charset="utf-8" />
        <script>
            (() => {
                let theme = 'auto';
                try {
                    theme = localStorage.getItem('theme') || 'auto';
                } catch {}
                const dark =
                    theme === 'dark'
                    || (theme !== 'light'
                        && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', dark);
            })();
        </script>
        <script>
            (() => {
                const root = document.documentElement;
                const read = key => {
                    try {
                        const parsed = JSON.parse(localStorage.getItem(key) || 'null');
                        return parsed && typeof parsed === 'object' ? parsed : null;
                    } catch {
                        return null;
                    }
                };
                let overrides = read('a11y_overrides');
                if (!overrides) {
                    const legacy = read('a11y_settings') || {};
                    overrides = Object.fromEntries(
                        Object.entries(legacy).filter(
                            ([, value]) => value !== false && value !== 100
                        )
                    );
                }
                const device = query => {
                    const list = window.matchMedia(query);
                    return list.media !== 'not all' && list.matches;
                };
                const pick = (key, query) =>
                    typeof overrides[key] === 'boolean' ? overrides[key]
                    : query ? device(query)
                    : false;
                root.setAttribute(
                    'data-reduce-motion',
                    String(pick('reduceMotion', '(prefers-reduced-motion: reduce)'))
                );
                root.setAttribute(
                    'data-solid-surfaces',
                    String(pick('solidSurfaces', '(prefers-reduced-transparency: reduce)'))
                );
                root.setAttribute(
                    'data-high-contrast',
                    String(pick('highContrast', '(prefers-contrast: more)'))
                );
                root.setAttribute('data-focus-highlight', String(pick('focusHighlight')));
                root.setAttribute('data-dyslexic-font', String(pick('dyslexicFont')));
                root.setAttribute(
                    'data-font-scale',
                    String(
                        [100, 110, 120, 130, 140, 150].includes(overrides.fontScale) ?
                            overrides.fontScale
                        :   100
                    )
                );
            })();
        </script>
        <script>
            window.dataLayer = window.dataLayer || [];

            function gtag() {
                window.dataLayer.push(arguments);
            }

            let savedConsent = null;
            try {
                const stored =
                    localStorage.getItem('idstead_cookie_consent_v2')
                    ?? localStorage.getItem('fkp_cookie_consent_v2');
                if (stored) savedConsent = JSON.parse(stored);
            } catch (e) {}

            const defaultConsent = {
                analytics_storage: 'denied',
                ad_storage: 'denied',
                ad_user_data: 'denied',
                ad_personalization: 'denied'
            };

            if (savedConsent) {
                defaultConsent.analytics_storage = savedConsent.analytics_storage || 'denied';
                defaultConsent.ad_storage = savedConsent.ad_storage || 'denied';
                defaultConsent.ad_user_data = savedConsent.ad_user_data || 'denied';
                defaultConsent.ad_personalization = savedConsent.ad_personalization || 'denied';
            } else {
                defaultConsent.wait_for_update = 500;
            }

            gtag('consent', 'default', defaultConsent);
            gtag('js', new Date());
            gtag('config', 'G-6HR3DKWZLF');
        </script>
        <script
            async
            src="https://www.googletagmanager.com/gtag/js?id=G-6HR3DKWZLF"></script>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1" />
        <link
            rel="ard"
            href="/.well-known/ard.json" />
        %sveltekit.head%
    </head>
    <body
        data-sveltekit-preload-data="hover"
        class="m-0 min-h-screen w-full overflow-x-clip bg-background p-0 font-sans text-text-primary">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
