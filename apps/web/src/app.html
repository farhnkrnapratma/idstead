<!doctype html>
<html
    lang="en"
    translate="no"
    class="scroll-pt-20 scroll-pb-21 overflow-x-clip scroll-smooth font-sans">
    <head>
        <meta charset="utf-8" />
        <script>
            (() => {
                let theme = 'auto';
                try {
                    theme = localStorage.getItem('theme') || 'auto';
                } catch {}
                const dark =
                    theme === 'dark'
                    || (theme !== 'light'
                        && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', dark);
            })();
        </script>
        <script>
            (() => {
                const root = document.documentElement;
                const read = key => {
                    try {
                        const parsed = JSON.parse(localStorage.getItem(key) || 'null');
                        return parsed && typeof parsed === 'object' ? parsed : null;
                    } catch {
                        return null;
                    }
                };
                const overrides = read('a11y_overrides') || {};
                const device = query => {
                    const list = window.matchMedia(query);
                    return list.media !== 'not all' && list.matches;
                };
                const pick = (key, query) =>
                    typeof overrides[key] === 'boolean' ? overrides[key]
                    : query ? device(query)
                    : false;
                root.setAttribute(
                    'data-reduce-motion',
                    String(pick('reduceMotion', '(prefers-reduced-motion: reduce)'))
                );
                root.setAttribute(
                    'data-high-contrast',
                    String(pick('highContrast', '(prefers-contrast: more)'))
                );
                root.setAttribute('data-focus-highlight', String(pick('focusHighlight')));
                root.setAttribute('data-dyslexic-font', String(pick('dyslexicFont')));
                root.setAttribute(
                    'data-font-scale',
                    String(
                        [100, 110, 120, 130, 140, 150].includes(overrides.fontScale) ?
                            overrides.fontScale
                        :   100
                    )
                );
            })();
        </script>
        %idstead.analytics%
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1" />
        <link
            rel="ard"
            href="/.well-known/ard.json" />
        %sveltekit.head%
    </head>
    <body
        data-sveltekit-preload-data="hover"
        class="m-0 min-h-screen w-full overflow-x-clip bg-canvas p-0 font-sans text-fg">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
