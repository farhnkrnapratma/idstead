PHASE_ENV = dev

dev {
    [dev.web, dev.admin, dev.api, dev.jobs],
    web = phase run --env $PHASE_ENV -- bun run --cwd apps/web dev,
    host = phase run --env $PHASE_ENV -- bun run --cwd apps/web dev --host,
    admin = phase run --env $PHASE_ENV -- bun run --cwd apps/admin dev,
    api = phase run --env $PHASE_ENV -- bun run --cwd apps/api dev,
    jobs = phase run --env $PHASE_ENV -- bun run --cwd apps/jobs dev,
    sites = [dev.web, dev.admin],
    workers = [dev.api, dev.jobs]
}

build { phase run --env prod -- bun run build, dev = phase run --env dev -- bun run build }
check { bun run check }
test { phase run --env $PHASE_ENV -- bun run test, only = phase run --env $PHASE_ENV -- bun test }
lint { bun run lint, fix = bun run lint:fix }
fmt { bun run fmt, check = bun run fmt:check }
install { bun install }
graph { graphify update . }
verify { [test, check, fmt.check] }
