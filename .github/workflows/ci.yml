name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run lint

      - name: Prepare env for build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            cp .env.preview.example .env
          else
            cp .env.production.example .env
          fi

      - name: Build (verifies the Cloudflare adapter build succeeds)
        run: bun run build
