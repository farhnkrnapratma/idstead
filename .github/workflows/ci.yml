# @format

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run lint

      - name: Build (verifies the Cloudflare adapter build succeeds)
        run: cp .env.example .env && bun run build
