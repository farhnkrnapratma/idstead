name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run lint

      - name: Prepare env for build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            cp .env.preview.example .env
          else
            cp .env.production.example .env
          fi

      - name: Build (verifies the Cloudflare adapter build succeeds)
        run: bun run build

  docs-sync-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: CLAUDE.md and AGENTS.md must change together
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          claude_changed=no
          agents_changed=no
          echo "$changed" | grep -qx 'CLAUDE.md' && claude_changed=yes
          echo "$changed" | grep -qx 'AGENTS.md' && agents_changed=yes
          if [ "$claude_changed" != "$agents_changed" ]; then
            echo "::error::CLAUDE.md and AGENTS.md must be updated together. The .claude/hooks/sync-claude-agents-md.sh hook keeps them in sync automatically during Claude Code sessions, but this PR only touched one of them - update the other by hand to match."
            exit 1
          fi

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint commit messages since base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bunx commitlint --from "origin/$BASE_REF" --to HEAD --verbose
